<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>GLB Viewer</title>
        <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
        </style>
    </head>
    <body>
        <script type="module">
import * as THREE from 'https://unpkg.com/three@0.166.1/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.166.1/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.166.1/examples/jsm/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(5, 5, 10);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 2);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 3);
directionalLight.position.set(10, 10, 10);
scene.add(directionalLight);

// Grid
const grid = new THREE.GridHelper(20, 20);
scene.add(grid);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Load GLB
const loader = new GLTFLoader();

loader.load(
    './chess.glb',
    (gltf) => {
        const model = gltf.scene;

        model.scale.set(1, 1, 1);

        // Example heading
        const heading = 45;

        model.rotation.y = THREE.MathUtils.degToRad(heading);

        scene.add(model);

        console.log('GLB loaded');
    },
    (xhr) => {
        console.log(
            (xhr.loaded / xhr.total * 100).toFixed(0) + '% loaded'
        );
    },
    (error) => {
        console.error(error);
    }
);

function animate() {
    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
        </script>
    </body>
</html>
